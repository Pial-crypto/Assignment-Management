services:

  postgres:
    image: postgres:16-alpine
    container_name: assignment-management-db

    restart: unless-stopped

    environment:
      POSTGRES_DB: assignment_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d assignment_management"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: AssignmentManagement.Api/Dockerfile

    container_name: assignment-management-api

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080

      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=assignment_management;Username=postgres;Password=postgres"

      Jwt__Key: "${JWT_KEY}"
      Jwt__Issuer: "AssignmentManagement.Api"
      Jwt__Audience: "AssignmentManagement.Client"
      Jwt__ExpirationMinutes: "60"

    ports:
      - "5000:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:5000/api"
        NEXT_STANDALONE: "true"

    container_name: assignment-management-frontend

    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "3000:3000"

    environment:
      NODE_ENV: production

volumes:
  postgres_data: